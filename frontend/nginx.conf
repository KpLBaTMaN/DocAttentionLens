upstream docattentionlens_api {
    zone docattentionlens_api 64k;
    # Docker changes container addresses on recreation. Refresh the service name.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/v1/setup/uploads {
        client_max_body_size 12g;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://docattentionlens_api;
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
    }
    # Saved-evidence analyses compute synchronously from verified shards; many-layer methods and
    # document studies can exceed the default 30 s under load, which surfaced as 504s.
    location ~ ^/api/v1/(methods/analyses|retrieval/captures/[^/]+/attention|document-studies) {
        proxy_pass http://docattentionlens_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://docattentionlens_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /health/ { proxy_pass http://docattentionlens_api; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
